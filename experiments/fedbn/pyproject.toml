[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plant-disease-fedbn-experiment"
version = "1.0.0"
requires-python = ">=3.11,<3.12"
description = "Controlled FedBN experiment"

dependencies = [
    "flwr[simulation]==1.44.0",
    "torch==2.15.0+cu132",
    "torchvision==0.29.2+cu132",
    "numpy"
]

[tool.uv]
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.flwr.app]
publisher = "farhan"

[tool.flwr.app.components]
serverapp = "backend.server.fair_fedbn_server_app:app"
clientapp = "backend.clients.fair_fedbn_client_app:app"

[tool.flwr.app.config]
num-server-rounds = 5
local-epochs = 1
batch-size = 16
learning-rate = 0.001